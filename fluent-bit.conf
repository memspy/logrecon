[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log
    Tag               logrecon
    Read_from_Head    false
    DB                /var/lib/fluent-bit/tail.db
    Skip_Long_Lines   On
    Refresh_Interval  2

[OUTPUT]
    Name    http
    Match   logrecon
    Host    127.0.0.1
    Port    8080
    URI     /fluentbit
    Format  json
