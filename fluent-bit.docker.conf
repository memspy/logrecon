[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name              tail
    Path              /hostlogs/${LOG_FILE}
    Tag               logrecon
    Read_from_Head    false
    DB                /fluent-bit/state/tail.db
    Skip_Long_Lines   On
    Refresh_Interval  2

[OUTPUT]
    Name    http
    Match   logrecon
    Host    ingest
    Port    8080
    URI     /fluentbit
    Format  json
